<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FirmwareBench · Experiment console</title><link rel="stylesheet" href="/assets/style.css"><script defer src="/assets/app.js"></script></head>
<body><header><div class="brand"><i class="mark" aria-hidden="true">▥</i>FirmwareBench</div><span class="host">LOCAL BENCH</span><nav><button id="compareNav" aria-current="page">Experiments</button><button id="setupNav">New experiment</button></nav></header>
<main><section id="results"><div class="intro"><div><p class="overline">Embedded C / host verification</p><h1>Experiment console</h1></div><button class="primary" id="new">New experiment <b>＋</b></button></div>
<div class="toolbar"><label>Experiment <select id="experiment"></select></label><a id="export" href="/api/experiments/saved/export" download>Export JSON ↓</a><label class="import">Open export <input type="file" id="import" accept=".json,application/json"></label></div>
<div role="status" id="message"></div><div id="evidence"></div></section>
<section id="setup" hidden><div class="intro"><div><p class="overline">Embedded C / experiment setup</p><h1>Configure experiment</h1></div></div><form id="form"><div class="form-grid"><fieldset><legend>Configuration</legend><label>Experiment name<input name="title" value="Firmware repair comparison" maxlength="100" required></label><label>Agent A<select name="agentA"></select></label><label>Agent B<select name="agentB"></select></label><label>Model route<select name="route"></select></label><label>Suite version<select name="suite"><option>embedded-c/1</option></select></label></fieldset><fieldset><legend>Tasks and disruptions</legend><div id="tasks"></div><hr><div id="scenarios"></div></fieldset><fieldset><legend>Trial limits</legend><label><input type="checkbox" name="show_edit_feedback"> Show updated source after edits</label><label>Repetitions<input type="number" name="repeats" value="3" min="1" max="10" required></label><label>Decision turns<input type="number" name="turn_limit" value="5" min="1" max="20" required></label><label>Tool attempts<input type="number" name="tool_limit" value="12" min="1" max="60" required></label><label>Seconds per agent<input type="number" name="seconds" value="120" min="15" max="600" required></label></fieldset></div><div class="launch"><strong id="count"></strong><button class="primary" type="submit">Start experiment →</button></div><p role="alert" id="formError"></p></form></section>
<dialog id="drawer"><div class="dialogbar"><p class="overline">Trial evidence</p><button id="close">Close ×</button></div><div id="detail"></div></dialog></main></body></html>
